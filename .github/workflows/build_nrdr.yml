name: Build NRDR for C3XL

on:
  push:
    branches: [ nrdr-clean ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scons numpy

      - name: Build openpilot
        run: |
          ./build.py

      - name: Package output
        run: |
          tar -czvf openpilot-build.tar.gz --exclude='.git' .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nrdr-build
          path: openpilot-build.tar.gz
