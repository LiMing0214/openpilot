name: Package NRDR source for C3XL
on:
  push:
    branches: [ nrdr-clean ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Package output
        run: |
          tar -czvf openpilot-source.tar.gz --exclude='.git' --exclude='*.pyc' --exclude='__pycache__' .
